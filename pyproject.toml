[project]
name = "pydaq"
version = "0.1.0"
description = "Lightweight schedule-based data acquisition orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "schedule>=1.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
sftp = ["paramiko>=3.4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "integration: integration tests",
]