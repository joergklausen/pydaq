station:
  wsi: 0-20008-0-NRB
  id: nrb
  name: Nairobi (GAW Regional Station)
  timezone: UTC

paths:
  root: ~/Documents/nrb
  data: data
  outbox: outbox
  logs: logs

logging:
  file: pydaq.log
  level_console: info
  level_file: warning

main:
  loop_sleep_seconds: 1
  config_reload_seconds: 60
  dashboard:
    enabled: true
    host: 0.0.0.0
    port: 8088

transfer:
  require_all_targets: true # require successful transfer of all targets before emptying the outbox.
  scan_every_seconds: 600
  retries: 3
  backoff_seconds: 2
  max_backoff_seconds: 30
  targets:
    s3:
      enabled: true
      parameters:
        endpoint_url: https://service.meteoswiss.ch/
        bucket: ch.meteoswiss.gawkenya
        prefix: nrb/incoming
        region: eu-central-1
        # access_key: ~/.secrets/s3_access_key
        # secret_key: ~/.secrets/s3_secret_key
        access_key: gawkenya_native
        secret_key: ~/.aws/minio-devt-secret-key
        verify: true
        addressing_style: path
    sftp:
      enabled: true
      parameters:
        host: sftp.meteoswiss.ch
        user: gaw_kenya
        remote_base: "./nrb"
        key: ~/.ssh/nrb-ed25519-20260508
        proxy:
            socks5:             # proxy url (leave empty if no proxy is used)
            port: 1080

network_monitor:
  enabled: true
  interval_s: 60
  timeout_s: 1.0
  log_unchanged_every_n: 0

instruments:
  49c:
    enabled: false
    driver: 49c
    io: 
      kind: serial
      device: /dev/ttyusb0 
      baudrate: 9600 
      bytesize: 8 
      parity: n
      stopbits: 1
      timeout_seconds: 1 
    schedule:
      sample_every_seconds: 60
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: 49c
      remove_on_success: true
    init: {}
    processing: {}

  49i:
    mac: 00-06-3B-20-36-A1
    id: 49
    serial_number: 49I-B1NAA-12103910681
    enabled: true
    driver: 49i
    io: 
      kind: socket 
      host: 192.168.2.14
      port: 9880
      timeout: 5
      sleep: 0.5
    schedule:
      sample_every_seconds: 60
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: 49i
      remove_on_success: true
    init: {}
    processing: {}

  fidas:
    # mac: 00-18-7D-2D-CA-84
    # serial_number: 6082
    enabled: true
    driver: FIDAS
    io:
      kind: udp
      host: 0.0.0.0 #192.168.2.223
      port: 56790
      buffer_size: 8192
      timeout: 0.5
      sleep: 0.5
    schedule:  
      sample_every_seconds: 5             # How often should data be read from instrument?
      aggregation_period_minutes: 1       # What aggregate of data should be stored?
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: fidas
      remove_on_success: true
    init: {}
    processing: {}

  ae31:
    enabled: true
    driver: ae31 #pydaq.instruments.magee.AE31
    id: 9440810
    serial_number: "944:0810"
    io:
      kind: serial
      device: /dev/ttyUSB2
      baudrate: 9600
      bytesize: 8
      parity: N
      stopbits: 1
      timeout_seconds: 270
    schedule:
      sample_every_seconds: 300
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 300
    output:
      format: csv_zip
      remote_path: ae31
      remove_on_success: true
    init: {}
    processing: {}

  aurora3000:
    # Ecotech Aurora 3000 nephelometer using the legacy Aurora ASCII protocol.
    # Set enabled: true once the serial device path has been verified on the NRB RPi.
    enabled: true
    driver: aurora3000
    protocol: aurora
    id: 0                       # Aurora serial address; VI099/ID0 when id=0.
    serial_id: 0
    serial_number: ""
    io:
      kind: serial
      device: /dev/ttyUSB0
      baudrate: 19200
      bytesize: 8
      parity: N
      stopbits: 1
      timeout_seconds: 1
      read_sleep: 0.05
    schedule:
      sample_every_seconds: 5             # Poll instant VI099 readings every 5 s.
      aggregation_period_minutes: 1       # Emit one averaged record per minute.
      aggregation_timestamp: end          # Match the legacy Aurora reference-file convention.
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 60
    output:
      format: csv_zip
      remote_path: aurora3000
      remove_on_success: true
    init:
      id_on_initialize: true
    processing:
      aggregation_method: mean            # Aurora reference files average all VI099 numeric fields.

  hmp110-inlet:
    enabled: true
    driver: hmpascii
    id: 1
    serial_number: U2110079  # aerosol inlet manyfold
    io:
      # kind: socket
      # host: 192.168.0.100
      # port: 5004
      kind: serial
      port: /dev/ttyUSB1
      baudrate: 19200 
      bytesize: 8 
      parity: N
      stopbits: 1
      timeout_seconds: 1 
      timeout: 5.0
      idle_timeout: 0.25
      sleep: 0.1
    schedule:
      sample_every_seconds: 5
      aggregation_period_minutes: 1
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: hmp110-inlet
      remove_on_success: true
    init:
      command_sequence:
        - "SEND {id}"

  hmp110-ae31:
    enabled: true
    driver: hmpascii
    id: 2
    serial_number: M4730288  # inlet AE31
    io:
      # kind: socket
      # host: 192.168.0.100
      # port: 5004
      kind: serial
      port: /dev/ttyUSB1
      baudrate: 19200 
      bytesize: 8 
      parity: N
      stopbits: 1
      timeout_seconds: 1 
      timeout: 5.0
      idle_timeout: 0.25
      sleep: 0.1
    schedule:
      sample_every_seconds: 5
      aggregation_period_minutes: 1
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: hmp110-ae31
      remove_on_success: true
    init:
      command_sequence:
        - "SEND {id}"

  hmp110-lab:
    enabled: true
    driver: hmpascii
    id: 3
    serial_number: U2110085  # inside lab near window
    io:
      # kind: socket
      # host: 192.168.0.100
      # port: 5004
      kind: serial
      port: /dev/ttyUSB1
      baudrate: 19200 
      bytesize: 8 
      parity: N
      stopbits: 1
      timeout_seconds: 1 
      timeout: 5.0
      idle_timeout: 0.25
      sleep: 0.1
    schedule:
      sample_every_seconds: 5
      aggregation_period_minutes: 1
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: hmp110-lab
      remove_on_success: true
    init:
      command_sequence:
        - "SEND {id}"
