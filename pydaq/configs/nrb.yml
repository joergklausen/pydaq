  avo-roof:
    enabled: true
    driver: avo
    io:
      kind: http
      urls:
        roof: https://device.iqair.com/v2/64b79227b6f7b1125b019970
      validated: false
      timeout_seconds: 30
      retries: 3
      backoff_seconds: 2
      verify: true
    schedule:
