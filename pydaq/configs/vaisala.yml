station:
  wsi: 0-20008-0-test
  id: tst
  name: Test
  timezone: UTC

paths:
  root: ~/Documents/test
  data: data
  outbox: outbox
  logs: logs

logging:
  file: pydaq.log
  level_console: info
  level_file: warning
  max_bytes: 2_000_000
  backup_count: 7

main:
  loop_sleep_seconds: 1
  config_reload_seconds: 60
  dashboard:
    enabled: true
    host: 0.0.0.0
    port: 8088

transfer:
  require_all_targets: true
  scan_every_seconds: 600
  retries: 3
  backoff_seconds: 2
  max_backoff_seconds: 30
  targets:
    s3:
      enabled: false
      parameters:
        endpoint_url: https://service.meteoswiss.ch/
        bucket: ch.meteoswiss.gawkenya
        prefix: nrb/incoming
        region: eu-central-1
        access_key: gawkenya_native
        secret_key: ~/.aws/minio-devt-secret-key
        verify: true
        addressing_style: path
    sftp:
      enabled: false
      parameters:
        host: sftp.meteoswiss.ch
        user: gaw_kenya
        remote_base: ./test
        key: ~/.ssh/private-open-ssh-4096-mkn.ppk
        proxy:
          socks5:
          port: 1080

network_monitor:
  enabled: true
  interval_s: 60
  timeout_s: 1.0
  log_unchanged_every_n: 0

instruments:
  hmp60:
    enabled: true
    driver: hmpascii
    id: 5
    serial_number: T4744529-U0000072-R00A0A3B0
    io:
      kind: socket
      host: 192.168.0.100
      port: 5004
      timeout: 5.0
      idle_timeout: 0.25
      sleep: 0.1
    schedule:
      sample_every_seconds: 5
      aggregation_period_minutes: 1
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: hmp60
      remove_on_success: true
    init:
      command_sequence:
        - "SEND {id}"
