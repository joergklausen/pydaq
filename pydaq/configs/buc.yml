station:
  wsi: 
  id: buc
  name: Bomet University College
  timezone: UTC

paths:
  root: ~/pydaq/buc
  data: data
  outbox: outbox
  logs: logs

logging:
  file: pydaq.log
  level_console: info
  level_file: error

main:
  loop_sleep_seconds: 1
  config_reload_seconds: 60
  dashboard:
    enabled: true
    host: 0.0.0.0
    port: 8088

transfer:
  require_all_targets: false
  scan_every_seconds: 600
  retries: 3
  backoff_seconds: 2
  max_backoff_seconds: 30
  targets:
    s3:
      enabled: true
      parameters:
        endpoint_url: https://servicedevt.meteoswiss.ch/
        bucket: ch.meteoswiss.gawkenya
        prefix: buc
        region: eu-central-1
        access_key_id: ~/.secrets/s3_access_key_id
        secret_access_key: ~/.secrets/s3_secret_access_key
        verify: true
        addressing_style: path
    sftp:
      enabled: true
      parameters:
        host: 41.89.116.106
        user: ozoneuser
        remote_base: "./incoming"
        key: "~/.ssh/id_ed25519"
        port: 22

network_monitor:
  enabled: true
  interval_s: 60
  timeout_s: 1.0
  log_unchanged_every_n: 0

instruments:
  49i:
    enabled: true
    serial_number: 49I-B3NAA-CM09350107
    driver: Thermo49i
    io: 
      kind: socket 
      host: 192.168.100.49
      port: 9880
      timeout: 5
      sleep: 0.5
    schedule:
      sample_every_seconds: 60
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: 49i
      remove_on_success: true
    init: {}
    processing: {}
