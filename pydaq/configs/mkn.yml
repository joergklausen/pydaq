station:
  wsi: 0-20008-0-MKN
  id: mkn
  name: Mount Kenya (GAW Global Station)
  timezone: UTC

paths:
  root: ~/pydaq/mkn
  data: data
  outbox: outbox
  logs: logs

logging:
  file: pydaq.log
  level_console: info
  level_file: warning

main:
  loop_sleep_seconds: 1
  config_reload_seconds: 60
  dashboard:
    enabled: true
    host: 0.0.0.0
    port: 8088

transfer:
  require_all_targets: true # require successful transfer of all targets before emptying the outbox.
  scan_every_seconds: 600
  retries: 3
  backoff_seconds: 2
  max_backoff_seconds: 30
  targets:
    s3:
      enabled: true
      parameters:
        endpoint_url: https://service.meteoswiss.ch/
        bucket: ch.meteoswiss.gawkenya
        prefix: mkn/incoming
        region: eu-central-1
        access_key: ~/.secrets/s3-access-key
        secret_key: ~/.secrets/s3-secret-key
        verify: true
        addressing_style: path
    sftp:
      enabled: true
      parameters:
        host: sftp.meteoswiss.ch
        user: gaw_mkn
        remote_base: "./mkn"
        key: ~/.ssh/mkn-ed25519-20260508
        proxy:
            socks5:             # proxy url (leave empty if no proxy is used)
            port: 1080

network_monitor:
  enabled: true
  interval_s: 60
  timeout_s: 1.0
  log_unchanged_every_n: 0

instruments:
  49c:
    enabled: false
    driver: 49c
    io: 
      kind: serial
      device: COM3 #/dev/ttyusb0 
      baudrate: 9600 
      bytesize: 8 
      parity: n
      stopbits: 1
      timeout_seconds: 1 
    schedule:
      sample_every_seconds: 60
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: 49c
      remove_on_success: true
    init: {}
    processing: {}

  49i:
    mac: 00-06-3B-20-36-A1
    id: 49
    serial_number: 49I-B1NAA-12103910681
    enabled: true
    driver: 49i
    io: 
      kind: socket 
      host: 192.168.3.190
      port: 9880
      timeout: 5
      sleep: 0.5
    schedule:
      sample_every_seconds: 60
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: 49i
      remove_on_success: true
    init: {}
    processing: {}

  fidas:
    mac: 00-18-7D-2D-CA-84
    serial_number: 6082
    enabled: true
    driver: FIDAS
    io:
      kind: udp
      host: 0.0.0.0 #192.168.3.182
      port: 56790
      buffer_size: 8192
      timeout: 0.5
      sleep: 0.5
    schedule:  
      sample_every_seconds: 5             # How often should data be read from instrument?
      aggregation_period_minutes: 1       # What aggregate of data should be stored?
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: fidas
      remove_on_success: true
    init: {}
    processing: {}

  ae33:
    enabled: true
    driver: ae33
    id: 169
    serial_number: AE33-S10-01394
    mac: C4-00-AD-D8-0A-AC
    io:
      kind: socket
      host: 192.168.3.137
      port: 8002
      timeout_seconds: 0.5
      sleep_seconds: 0.5
    schedule:
      sample_every_seconds: 60
      rollover: hourly
      rollover_at: ":00"
      transmit_every_seconds: 3600
      transmit_delay_seconds: 15
      print_every_seconds: 30
    output:
      format: csv_zip
      remote_path: ae33
      remove_on_success: true
    init:
      get_config:
        - HELLO
      set_datetime: false
    processing: {}    